<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seed Previewer — PlateUp Seed Tools</title>
  <!-- OG_META -->
  <link rel="stylesheet" href="/css/theme.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="/">PlateUp <span class="accent">Seed</span> Tools</a>
      <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav">
        <span class="sr-only">Menu</span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <nav class="main-nav" id="main-nav">
        <a href="/">Home</a>
        <a href="/preview" class="active">Seed Previewer</a>
        <a href="/search">Seed Search</a>
        <a href="/explorer">Seed Explorer</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-intro">
      <h1>Seed Previewer</h1>
      <p class="subtitle">Preview a kitchen layout for any seed, in any restaurant setting.</p>
    </div>

    <form id="layout-form" class="controls">
      <label class="field">
        <span>Restaurant setting</span>
        <select id="setting-select" required></select>
      </label>

      <label class="field">
        <span>Seed</span>
        <input id="seed-input" type="text" maxlength="8" placeholder="bdghjmqr" autocomplete="off" required />
      </label>

      <button type="submit">Preview</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="result" class="result" hidden>
      <div class="result-meta">
        <span id="result-title"></span>
        <button type="button" id="copy-link" class="link-button">Copy link</button>
        <button type="button" id="save-favorite" class="link-button">☆ Save to Favorites</button>
        <a id="speedrun-link" class="link-button" target="_blank" rel="noopener">
          <img src="https://budditec.nz/plateup-speed-run-tools/favicon.png" alt="" class="speedrun-link-icon" />
          Blueprints
        </a>
      </div>
      <div id="grid" class="grid"></div>
      <p class="legend" id="legend"></p>

      <details class="color-panel" id="color-panel">
        <summary>⚙ Customize colors</summary>
        <div id="color-panel-rows" class="color-panel-rows"></div>
        <button type="button" id="color-panel-reset-all" class="link-button color-panel-reset-all">Reset all to default</button>
      </details>
    </section>
  </main>

  <script src="/js/nav.js"></script>
  <script src="/js/shared.js"></script>
  <script src="/js/speedrun-link.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/favorites.js"></script>
</body>
</html>
